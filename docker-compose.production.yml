services:
  db:
    image: postgres:16-alpine
    env_file: .env.production
    volumes:
      - oae-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build: .
    command: ["uvicorn", "oae.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - oae-data:/app/data
    restart: unless-stopped

  worker:
    build: .
    command: ["oae-worker", "--name", "oae-worker-1", "--pool", "engineering"]
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - oae-data:/app/data
    restart: unless-stopped

  relay:
    build: .
    command: ["oae-relay", "--poll-seconds", "1"]
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    build: .
    command: ["oae-migrate"]
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]
    restart: "no"

volumes:
  oae-data:
  oae-postgres:
