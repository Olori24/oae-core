services:
  db:
    image: postgres:16-alpine
    env_file: .env.production
    volumes:
      - oae-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build: .
    command: ["uvicorn", "oae.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - oae-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build: .
    # Omit a fixed worker name so Compose can safely scale this service.
    # oae-worker defaults its identity from the container hostname.
    command: ["oae-worker", "--pool", "engineering"]
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - oae-data:/app/data
    restart: unless-stopped

  relay:
    build: .
    command: ["oae-relay", "--poll-seconds", "1"]
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    build: .
    command: ["oae-migrate"]
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]
    restart: "no"

  gateway:
    image: caddy:2.8-alpine
    env_file: .env.production
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - oae-caddy-data:/data
      - oae-caddy-config:/config
    restart: unless-stopped

volumes:
  oae-data:
  oae-postgres:
  oae-caddy-data:
  oae-caddy-config:
