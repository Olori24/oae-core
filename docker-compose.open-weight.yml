services:
  ollama:
    image: ollama/ollama:0.11.3
    profiles: ["open-weight"]
    expose:
      - "11434"
    volumes:
      - oae-ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 18
    restart: unless-stopped

  ollama-pull-qwen3:
    image: ollama/ollama:0.11.3
    profiles: ["open-weight-tools"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    command: ["pull", "qwen3:8b"]
    restart: "no"

volumes:
  oae-ollama-models:
