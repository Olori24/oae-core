name: Developer Arsenal — Wave 1

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-regressions:
    name: Security regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock.txt && python -m pip install --no-deps -e .
      - name: Compile application
        run: python -m compileall -q src tests
      - name: Run tenant isolation regressions
        run: pytest -q tests/test_developer_arsenal_security_regressions.py

  critical-api-contracts:
    name: Critical API contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock.txt && python -m pip install --no-deps -e .
      - name: Run core API tests
        run: pytest -q tests/test_api.py tests/test_application_quality_gate.py
