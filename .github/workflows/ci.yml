name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: pip install -r requirements.lock.txt && pip install -e . --no-deps
      - name: Compile
        run: python -m compileall -q src
      - name: Test with coverage
        run: pytest -q --cov=oae --cov-report=term-missing --cov-fail-under=70

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.12.2
      - name: Ruff
        run: ruff check src tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: pip install -r requirements.lock.txt && pip install -e . --no-deps
      - name: Mypy
        run: mypy src
