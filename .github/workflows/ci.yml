name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oae_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oae_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OAE_POSTGRES_TEST_URL: postgresql://postgres:postgres@localhost:5432/oae_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: pip install -r requirements.lock.txt && pip install "psycopg-pool==3.3.1" && pip install -e . --no-deps
      - name: Compile
        run: python -m compileall -q src
      - name: Test with coverage
        run: pytest -q --cov=oae --cov-report=term-missing --cov-report=json:coverage.json
      - name: Enforce coverage threshold
        run: python scripts/check_coverage_threshold.py --coverage-file coverage.json --threshold 70

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.12.2
      - name: Ruff
        run: ruff check src tests scripts

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: pip install -r requirements.lock.txt && pip install "psycopg-pool==3.3.1" && pip install -e . --no-deps
      - name: Mypy
        run: mypy src