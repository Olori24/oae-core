<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360"><rect width="1400" height="360" rx="32" fill="#070b18"/><text x="700" y="56" text-anchor="middle" fill="#fff" font-family="Arial" font-size="30" font-weight="800">EVIDENCE LANGUAGE</text><g font-family="Arial" text-anchor="middle"><g fill="#0f172a" stroke="#22d3ee" stroke-width="2"><rect x="70" y="115" width="260" height="135" rx="20"/><rect x="370" y="115" width="260" height="135" rx="20"/><rect x="670" y="115" width="260" height="135" rx="20"/><rect x="970" y="115" width="360" height="135" rx="20"/></g><g fill="#fff" font-size="20" font-weight="700"><text x="200" y="157">IMPLEMENTED</text><text x="500" y="157">TESTED</text><text x="800" y="157">DEPLOYED</text><text x="1150" y="157">VERIFIED IN PRODUCTION</text></g><g fill="#94a3b8" font-size="14"><text x="200" y="190">exists in repository</text><text x="200" y="214">code path is present</text><text x="500" y="190">executed test / CI evidence</text><text x="500" y="214">repeatable quality signal</text><text x="800" y="190">target is configured</text><text x="800" y="214">not proof of live health</text><text x="1150" y="190">real environment evidence</text><text x="1150" y="214">measured, traceable proof</text></g></g><text x="700" y="305" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="14">OAE intentionally separates architecture, implementation, automated verification, and production reality.</text></svg>