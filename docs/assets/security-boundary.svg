<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520"><defs><linearGradient id="s" x1="0" x2="1"><stop stop-color="#34d399"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><rect width="1400" height="520" rx="32" fill="#070b18"/><text x="700" y="58" text-anchor="middle" fill="#fff" font-family="Arial" font-size="32" font-weight="800">SECURITY BOUNDARY</text><text x="700" y="88" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="16">Identity → tenant scope → policy → durable execution → evidence</text><g font-family="Arial" text-anchor="middle"><g fill="#0f172a" stroke="url(#s)" stroke-width="2"><rect x="70" y="150" width="220" height="180" rx="22"/><rect x="330" y="150" width="220" height="180" rx="22"/><rect x="590" y="150" width="220" height="180" rx="22"/><rect x="850" y="150" width="220" height="180" rx="22"/><rect x="1110" y="150" width="220" height="180" rx="22"/></g><g fill="#fff" font-size="20" font-weight="700"><text x="180" y="195">IDENTITY</text><text x="440" y="195">TENANT</text><text x="700" y="195">AUTHORITY</text><text x="960" y="195">SECRETS</text><text x="1220" y="195">EVIDENCE</text></g><g fill="#94a3b8" font-size="14"><text x="180" y="230">Bearer API keys</text><text x="180" y="255">principal roles</text><text x="180" y="280">hashed storage</text><text x="440" y="230">RLS context</text><text x="440" y="255">server-side ownership</text><text x="440" y="280">scoped records</text><text x="700" y="230">requester ≠ approver</text><text x="700" y="255">revocation + expiry</text><text x="700" y="280">worker enforcement</text><text x="960" y="230">no raw credentials</text><text x="960" y="255">server-side env</text><text x="960" y="280">redacted errors</text><text x="1220" y="230">tests + CI</text><text x="1220" y="255">audit events</text><text x="1220" y="280">production evidence</text></g></g><path d="M290 240H330M550 240H590M810 240H850M1070 240H1110" stroke="url(#s)" stroke-width="4"/><rect x="235" y="385" width="930" height="65" rx="18" fill="#0f172a" stroke="#334155"/><text x="700" y="413" text-anchor="middle" fill="#e2e8f0" font-family="Arial" font-size="16" font-weight="700">Security posture is a boundary, not a badge.</text><text x="700" y="435" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="13">Controls are implemented and tested in code; real-host deployment remains a separate verification layer.</text></svg>